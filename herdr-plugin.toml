# herdr-plugin.toml — manifest for the dagr plugin.
#
# dagr draws a live DAG of an agent swarm from a contract file (CONTRACT.md)
# in a herdr split pane. The pane renders and focuses; run-state writes only
# ever come from a producer command the user confirms at a gate — dagr
# itself never mutates run state. Schema verified against a field plugin on
# herdr 0.8.0 (top-level keys, [[build]], [[panes]], [[actions]]).
#
# On Unix the pane command resolves the binary from the injected plugin root.
# On Windows, where Herdr preview cannot launch plugin-relative executables,
# the action opens a pane and runs the absolute dagr.exe path itself. Both
# launchers preserve the user's cwd; the viewer's own fallback reads
# HERDR_PLUGIN_CONTEXT_JSON (workspace_cwd → focused_pane_cwd → cwd), see
# `dagr view --help`.

id = "herdr-dagr"
name = "herdr-dagr"
version = "0.2.0"
description = "Your agent swarm as a live DAG: an orchestration graph with attempts, review gates, and evidence, in a herdr split pane."
min_herdr_version = "0.8.0"
platforms = ["linux", "macos", "windows"]

# GitHub installs download and verify a binary only when its release commit
# matches the installed source revision. Unreleased or locally changed refs
# fall back to Cargo; `plugin link` skips build commands, so contributors run
# scripts/build.sh (Unix) or scripts/build.ps1 (Windows).
[[build]]
platforms = ["linux", "macos"]
command = ["bash", "scripts/install.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

# The viewer pane. herdr performs the split placement on launch; the
# [[actions]] below summon it.
[[panes]]
id = "dagr"
title = "dagr"
platforms = ["linux", "macos"]
placement = "split"
# The binary is resolved from $HERDR_PLUGIN_ROOT (injected by herdr into
# pane processes), NOT relatively: herdr resolves a relative argv[0]
# against the pane's cwd, and the launcher sets --cwd to the USER'S
# workspace for run-file discovery — a bare "./bin/dagr"
# only works when that workspace happens to be the plugin root.
command = ["/bin/sh", "-c", "exec \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/bin/dagr\" view"]

# Summon the pane (bind to a key in ~/.config/herdr/config.toml, or run
# `herdr plugin action invoke open-dagr --plugin herdr-dagr`). The
# launcher takes the placement as its argument: right | down | up |
# left (up/left compose split + swap, since herdr splits only go
# right/down). One action per placement so each can carry its own
# keybinding — placement is chosen when the pane opens, not after.
[[actions]]
id = "open-dagr"
platforms = ["linux", "macos"]
title = "Open dagr"
description = "Open the live run DAG in a split pane beside the current work."
contexts = ["workspace"]
command = ["bash", "scripts/open-dagr.sh", "right"]

[[actions]]
id = "open-dagr-down"
platforms = ["linux", "macos"]
title = "Open dagr (below)"
description = "Open the live run DAG in a split pane below the current work."
contexts = ["workspace"]
command = ["bash", "scripts/open-dagr.sh", "down"]

[[actions]]
id = "open-dagr-up"
platforms = ["linux", "macos"]
title = "Open dagr (above)"
description = "Open the live run DAG in a split pane above the current work."
contexts = ["workspace"]
command = ["bash", "scripts/open-dagr.sh", "up"]

[[actions]]
id = "open-dagr-left"
platforms = ["linux", "macos"]
title = "Open dagr (left)"
description = "Open the live run DAG in a split pane left of the current work."
contexts = ["workspace"]
command = ["bash", "scripts/open-dagr.sh", "left"]

[[actions]]
id = "open-dagr-right"
platforms = ["linux", "macos"]
title = "Open dagr (right)"
description = "Open the live run DAG in a split pane right of the current work."
contexts = ["workspace"]
command = ["bash", "scripts/open-dagr.sh", "right"]

# Windows action ids are distinct because Herdr requires action ids to be
# unique even when their platform sets do not overlap. The action cwd is not
# reliable on Windows, so each resolves the plugin root through Herdr and
# invokes the launcher script by absolute path. The script uses `pane split`
# + `pane run` because Herdr's Windows preview cannot spawn plugin-relative
# pane commands.
[[actions]]
id = "open-dagr-windows"
platforms = ["windows"]
title = "Open dagr"
description = "Open the live run DAG in a split pane beside the current work."
contexts = ["workspace"]
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-dagr'}|Select-Object -First 1).plugin_root); if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'scripts') 'open-dagr.ps1') right''',
]

[[actions]]
id = "open-dagr-down-windows"
platforms = ["windows"]
title = "Open dagr (below)"
description = "Open the live run DAG in a split pane below the current work."
contexts = ["workspace"]
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-dagr'}|Select-Object -First 1).plugin_root); if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'scripts') 'open-dagr.ps1') down''',
]

[[actions]]
id = "open-dagr-up-windows"
platforms = ["windows"]
title = "Open dagr (above)"
description = "Open the live run DAG in a split pane above the current work."
contexts = ["workspace"]
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-dagr'}|Select-Object -First 1).plugin_root); if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'scripts') 'open-dagr.ps1') up''',
]

[[actions]]
id = "open-dagr-left-windows"
platforms = ["windows"]
title = "Open dagr (left)"
description = "Open the live run DAG in a split pane left of the current work."
contexts = ["workspace"]
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-dagr'}|Select-Object -First 1).plugin_root); if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'scripts') 'open-dagr.ps1') left''',
]

[[actions]]
id = "open-dagr-right-windows"
platforms = ["windows"]
title = "Open dagr (right)"
description = "Open the live run DAG in a split pane beside the current work."
contexts = ["workspace"]
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-dagr'}|Select-Object -First 1).plugin_root); if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'scripts') 'open-dagr.ps1') right''',
